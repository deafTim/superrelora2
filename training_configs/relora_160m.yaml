# Model
model_name: "nicholasKluge/TeenyTinyLlama-160m"

# Dataset
dataset_name: "wikitext"
dataset_config: "wikitext-2-raw-v1"

method: relora

lora_r: 8
lora_alpha: 16.0
merge_every: 500
prune_ratio: 0.99
jagged_warmup_steps: 50

num_epochs: 3
batch_size: 8
max_length: 512
learning_rate: 2e-4
weight_decay: 0.01
gradient_accumulation_steps: 4

optimizer:
  type: "adamw"
  beta1: 0.9
  beta2: 0.999
  eps: 1e-8

scheduler:
  type: "cosine"
  warmup_steps: 100
  total_steps: 1000

fp16: true
bf16: false

logging_steps: 100
save_steps: 1000
eval_steps: 1000

target_modules:
  - "q_proj"
  - "k_proj"
  - "v_proj"
  - "o_proj"
  - "gate_proj"
  - "up_proj"
  - "down_proj"
